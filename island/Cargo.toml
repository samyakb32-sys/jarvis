[workspace]
members = ["protocol", "hook", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# The hook is spawned by Claude Code on every event: keep it small and fast to start.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
