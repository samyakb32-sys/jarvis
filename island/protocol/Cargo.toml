[package]
name = "jarvis-island-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wire protocol, hook replies, settings merge and the relay server shared by Jarvis Island and jarvis-hook"

[features]
# The async relay server, used by the app and by the hook's end-to-end tests.
server = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time", "test-util"] }
